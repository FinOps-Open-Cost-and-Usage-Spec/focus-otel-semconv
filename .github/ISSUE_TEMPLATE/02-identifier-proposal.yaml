name: Identifier proposal
description: Suggest a new focus.* identifier for the FOCUS Working Group to consider.
title: "Proposal: "
labels: ["proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for your suggestion. Before you start, please note:

        - **This is a proposal, not a registration.** Proposals are sent to the FOCUS Working Group, which decides whether to approve them through its own process. If the WG approves, a FOCUS Submitter registers the identifier. The decision is recorded on this issue, and the issue is closed with the outcome. You can also take part in the FOCUS Working Group directly at https://focus.finops.org.
        - **Only the `focus.*` namespace is in scope.** Identifiers in other namespaces are not registered in this repository.
        - **A proposal may be declined** if it is outside the `focus.*` namespace or the Scope, does not correspond to a concept in a published FOCUS specification or FOCUS WG-approved initiative, or duplicates an existing identifier.
        - **Drafting happens on `wg-staging`.** If the FOCUS WG takes the proposal forward, the YAML definition is drafted on the `wg-staging` branch, where CI and Weaver checks run against it, and linked back to this issue. Anyone taking part in the FOCUS WG can contribute there by pull request.
        - **No CLA is needed to open an issue.** If your idea is adopted, it will be written into the registry in the submitter's own words, not copied from this issue.

  - type: textarea
    id: need
    attributes:
      label: Telemetry need
      description: What telemetry (metric, trace or resource) do you want to link to FOCUS data, and why?
    validations:
      required: true

  - type: textarea
    id: focus-data
    attributes:
      label: Related FOCUS data
      description: Which FOCUS columns or requirements does this relate to? Give the FOCUS version and requirement ID where you can.
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: How would implementers or users use this identifier?
    validations:
      required: true

  - type: input
    id: suggested-name
    attributes:
      label: Suggested identifier name (optional)
      placeholder: focus.

  - type: textarea
    id: alternatives
    attributes:
      label: Existing alternatives (optional)
      description: Existing OpenTelemetry attributes or focus.* identifiers you considered, and why they don't meet the need.

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I have searched existing issues and the registry for a similar identifier.
          required: true
        - label: I agree to follow this project's Code of Conduct (08-code-of-conduct.md).
          required: true
