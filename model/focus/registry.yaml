file_format: definition/2

# focus.* attributes. Each carries the value of one FOCUS column, or one ID from
# the FOCUS value-attribution companion specification, so that telemetry can be
# joined to the bill and to the work it paid for. No new signals are defined.
#
# Naming: take the FOCUS column, split off its final property word (Id, Name)
# as the last segment, and write the rest in snake_case.
#
# annotations.focus records the FOCUS reference required by 02-scope.md
# (In scope, item 3). decision_record stays null until the FOCUS WG approves
# the attribute.

attributes:
  # Cost and Usage scope: join upstream to charges.

  - key: focus.service_provider.name
    type: string
    stability: development
    brief: >
      The name of the entity that provides the billed resource or service,
      exactly as it appears in the FOCUS ServiceProviderName column.
    note: |
      Set this when telemetry describes work billed by a known service provider.
      Unlike `cloud.provider`, which is a fixed list of cloud provider IDs, this
      attribute accepts any provider, including SaaS and data-center providers,
      and its value MUST equal the bill exactly.

      ResourceId is unique only within a service provider, so joins on
      `focus.resource.id` also require this attribute.
    examples: ['Amazon Web Services', 'Microsoft', 'OpenAI']
    annotations:
      focus:
        column: ServiceProviderName
        dataset: Cost and Usage
        spec_version: '1.4'
        section: '3.1.54'
        decision_record: null

  - key: focus.billing_account.id
    type: string
    stability: development
    brief: >
      The invoice-issuer-assigned identifier of the billing account, exactly
      as it appears in the FOCUS BillingAccountId column.
    note: |
      OpenTelemetry has no billing-account concept. BillingAccountId is
      unique within the invoice issuer, not the service provider, and is
      usually supplied by configuration rather than detected at runtime.

      Joins on this attribute assume a direct purchase, where the invoice
      issuer is the service provider. For marketplace purchases the bill
      carries the marketplace's billing account, which telemetry cannot know.
    examples: ['123456789012', 'org-AbC123']
    annotations:
      focus:
        column: BillingAccountId
        dataset: Cost and Usage
        spec_version: '1.4'
        section: '3.1.8'
        decision_record: null

  - key: focus.sub_account.id
    type: string
    stability: development
    brief: >
      The service-provider-assigned identifier of the sub account, exactly as
      it appears in the FOCUS SubAccountId column.
    note: |
      A sub account is the account a resource belongs to, such as an AWS member
      account, an Azure subscription, or a GCP project. This is the same level
      as `cloud.account.id`.

      **Open question:** this attribute may be deprecated in favor of
      `cloud.account.id` if OpenTelemetry can guarantee bill-exact values
      across all providers, including SaaS.
    examples: ['210987654321', 'my-gcp-project']
    annotations:
      focus:
        column: SubAccountId
        dataset: Cost and Usage
        spec_version: '1.4'
        section: '3.1.62'
        decision_record: null
        open_question: Reuse cloud.account.id if values are bill-exact.

  - key: focus.resource.id
    type: string
    stability: development
    brief: >
      The identifier of the billed resource, exactly as it appears in the
      FOCUS ResourceId column.
    note: |
      `cloud.resource_id` identifies the monitored resource, which can differ
      from the billed one: an Azure function rather than its function app, a
      Lambda ARN that includes a version, or ECS telemetry that names a task,
      container, or instance. This attribute MUST carry the billed resource.

      Leave this attribute unset when the charge is not tied to a resource,
      such as pay-per-token model usage.
    examples: ['arn:aws:ecs:us-east-1:210987654321:service/support/bot']
    annotations:
      focus:
        column: ResourceId
        dataset: Cost and Usage
        spec_version: '1.4'
        section: '3.1.51'
        decision_record: null
        open_question: Reuse cloud.resource_id if OpenTelemetry adds a billing-level identifier.

  - key: focus.service.name
    type: string
    stability: development
    brief: >
      The display name of the billed service offering, exactly as it appears
      in the FOCUS ServiceName column.
    note: |
      This is not OpenTelemetry's `service.name`, which names the emitting
      application. When a charge is not tied to a resource, as with
      pay-per-token model APIs, the service is the finest billing-scope key
      after the model.
    examples: ['Amazon Bedrock', 'OpenAI API']
    annotations:
      focus:
        column: ServiceName
        dataset: Cost and Usage
        spec_version: '1.4'
        section: '3.1.56'
        decision_record: null

  # Value scope: join downstream to tasks, outcomes, and value.

  - key: focus.task.id
    type: string
    stability: development
    brief: The identifier of the task that this work was done for.
    note: |
      A task is the unit of work that cost is allocated to, such as a support
      ticket, pull request, or batch job. It is usually an existing business key
      known at runtime.

      This attribute MUST NOT be set on metrics, since one value per task
      would create unbounded metric series.
    examples: ['ticket-4417', 'pr-1289']
    annotations:
      focus:
        companion_specification: 'Value Attribution Data Architecture: Schema and Explainer'
        companion_version: '0.1.4'
        dataset: Task
        column: TaskId
        decision_record: null

  - key: focus.outcome.id
    type: string
    stability: development
    brief: The identifier of the verified outcome that this work produced.
    note: |
      Outcomes are often verified after the telemetry is emitted, such as a
      deflection confirmed days later. When the outcome is not known at
      runtime, leave this attribute unset; the link is made through the Task
      dataset, which records each task's OutcomeId.

      This attribute MUST NOT be set on metrics.
    examples: ['deflection-4417']
    annotations:
      focus:
        companion_specification: 'Value Attribution Data Architecture: Schema and Explainer'
        companion_version: '0.1.4'
        dataset: Outcome
        column: OutcomeId
        decision_record: null

  - key: focus.workload.id
    type: string
    stability: development
    brief: >
      The identifier of the persistent business capability that this work
      belongs to, such as a support bot or a coding agent.
    note: |
      A workload may span many services and share services with other
      workloads. It differs from `service.name` (one deployed application),
      `service.namespace` (fixed per service on the Resource) and a Kubernetes
      workload (one deployment), because the caller sets it from configuration on
      each request and propagates it in baggage, so that shared services
      attribute their work to the caller.

      This attribute is low-cardinality and MAY be set on metrics.
    examples: ['support-bot', 'coding-agent']
    annotations:
      focus:
        companion_specification: 'Value Attribution Data Architecture: Schema and Explainer'
        companion_version: '0.1.4'
        dataset: All
        column: WorkloadId
        decision_record: null
        open_question: Pending OpenTelemetry Semantic Conventions SIG review against service.namespace.
