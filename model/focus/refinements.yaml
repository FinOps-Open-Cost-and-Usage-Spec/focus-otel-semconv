file_format: definition/2

# Signal-specific placement rules, written as refinements of signals that
# other registries own. They add focus.* attributes; they define no new
# signals. Each refinement is a proposal until agreed with the owning SIG.
#
# Placement rules (docs/focus/placement.md):
#   1. Billing scope of the emitting service goes on the OTel Resource.
#   2. Billing scope of a called service goes on the client span.
#   3. Value-attribution IDs go on spans and travel in baggage.
#   4. Only low-cardinality keys go on metrics: never task or outcome IDs.

span_refinements:
  - id: focus.gen_ai.client.inference
    ref: gen_ai.client.inference
    brief: >
      Adds FOCUS billing-scope keys and value-attribution IDs to the GenAI
      inference client span, so each model call can be joined to its charge
      and to the task it served.
    stability: development
    attributes: &focus_client_span_attributes
      - ref: focus.service_provider.name
        requirement_level: recommended
      - ref: focus.billing_account.id
        requirement_level:
          recommended: When known from configuration.
      - ref: focus.sub_account.id
        requirement_level:
          recommended: When the charge is related to a sub account.
      - ref: focus.resource.id
        requirement_level:
          conditionally_required: >
            When the called model is billed as a resource, such as provisioned
            throughput. Unset for pay-per-token usage.
      - ref: focus.service.name
        requirement_level: recommended
      - ref: focus.workload.id
        requirement_level: recommended
      - ref: focus.task.id
        requirement_level:
          recommended: When the task is known at runtime.
      - ref: focus.outcome.id
        requirement_level: opt_in

  # Embeddings are billed per token like inference, so the call carries the
  # same keys.
  - id: focus.gen_ai.client.embeddings
    ref: gen_ai.client.embeddings
    brief: >
      Adds FOCUS billing-scope keys and value-attribution IDs to the GenAI
      embeddings client span, so each embeddings call can be joined to its
      charge and to the task it served.
    stability: development
    attributes: *focus_client_span_attributes

  # Workflow, agent and tool spans are not billed calls themselves, so they
  # carry only the value-attribution IDs (rule 3). A workflow or agent span is
  # usually where a task starts; baggage carries the IDs to the calls beneath.
  - id: focus.gen_ai.invoke_workflow.internal
    ref: gen_ai.invoke_workflow.internal
    brief: >
      Adds FOCUS value-attribution IDs to the GenAI workflow span, usually the
      root of the work done for a task.
    stability: development
    attributes: &focus_value_attribution_ids
      - ref: focus.workload.id
        requirement_level: recommended
      - ref: focus.task.id
        requirement_level:
          recommended: When the task is known at runtime.
      - ref: focus.outcome.id
        requirement_level: opt_in

  - id: focus.gen_ai.invoke_agent.internal
    ref: gen_ai.invoke_agent.internal
    brief: >
      Adds FOCUS value-attribution IDs to the span for an agent invoked in
      process.
    stability: development
    attributes: *focus_value_attribution_ids

  - id: focus.gen_ai.invoke_agent.client
    ref: gen_ai.invoke_agent.client
    brief: >
      Adds FOCUS value-attribution IDs to the span for a call to a remote
      agent, so the remote agent's work is attributed to the caller's task.
    stability: development
    attributes: *focus_value_attribution_ids

  - id: focus.gen_ai.execute_tool.internal
    ref: gen_ai.execute_tool.internal
    brief: >
      Adds FOCUS value-attribution IDs to the tool execution span.
    stability: development
    attributes: *focus_value_attribution_ids

metric_refinements:
  - id: focus.gen_ai.client.inference.usage.input_tokens
    ref: gen_ai.client.inference.usage.input_tokens
    brief: >
      Adds low-cardinality FOCUS keys to the input-token usage metric, so exact
      token totals can be joined to charges by billing scope and workload.
    stability: development
    attributes: &focus_metric_attributes
      - ref: focus.service_provider.name
        requirement_level: recommended
      - ref: focus.billing_account.id
        requirement_level:
          recommended: When known from configuration.
      - ref: focus.service.name
        requirement_level: recommended
      - ref: focus.workload.id
        requirement_level: recommended

  - id: focus.gen_ai.client.inference.usage.output_tokens
    ref: gen_ai.client.inference.usage.output_tokens
    brief: >
      Adds low-cardinality FOCUS keys to the output-token usage metric, so exact
      token totals can be joined to charges by billing scope and workload.
    stability: development
    attributes: *focus_metric_attributes

  # Cached and reasoning tokens are usually priced differently from other
  # tokens, so their totals need the same billing-scope keys.
  - id: focus.gen_ai.client.inference.usage.cache_read.input_tokens
    ref: gen_ai.client.inference.usage.cache_read.input_tokens
    brief: >
      Adds low-cardinality FOCUS keys to the cache-read input-token usage
      metric, so cached-token totals can be joined to charges by billing scope
      and workload.
    stability: development
    attributes: *focus_metric_attributes

  - id: focus.gen_ai.client.inference.usage.cache_write.input_tokens
    ref: gen_ai.client.inference.usage.cache_write.input_tokens
    brief: >
      Adds low-cardinality FOCUS keys to the cache-write input-token usage
      metric, so cache-write totals can be joined to charges by billing scope
      and workload.
    stability: development
    attributes: *focus_metric_attributes

  - id: focus.gen_ai.client.inference.usage.reasoning.output_tokens
    ref: gen_ai.client.inference.usage.reasoning.output_tokens
    brief: >
      Adds low-cardinality FOCUS keys to the reasoning output-token usage
      metric, so reasoning-token totals can be joined to charges by billing
      scope and workload.
    stability: development
    attributes: *focus_metric_attributes

  - id: focus.gen_ai.client.embeddings.operation.input_tokens
    ref: gen_ai.client.embeddings.operation.input_tokens
    brief: >
      Adds low-cardinality FOCUS keys to the embeddings input-token metric, so
      exact token totals can be joined to charges by billing scope and
      workload.
    stability: development
    attributes: *focus_metric_attributes

entity_refinements:
  # Rule 1: when the emitting process is itself a billed resource, its own
  # billing scope goes on its OTel Resource, so every signal it emits carries it.
  - id: focus.service.instance
    ref: service.instance
    brief: >
      Adds the FOCUS billing scope of a service instance that is itself a
      billed resource, such as a container service or a VM.
    note: |
      Set these attributes only when the instance's own charge appears in
      FOCUS Cost and Usage data. The billing scope of a service the instance
      calls goes on the client span for that call, not here.

      `service.instance.cost_center.id` records an internal allocation target,
      such as a team or cost code. The `focus.*` attributes record where the
      charge appears on the bill. Both may be set.
    stability: development
    description:
      - ref: focus.service_provider.name
        requirement_level:
          recommended: When the instance is a billed resource.
      - ref: focus.billing_account.id
        requirement_level:
          recommended: When the instance is a billed resource and the value is known from configuration.
      - ref: focus.sub_account.id
        requirement_level:
          recommended: When the instance's charge is related to a sub account.
      - ref: focus.resource.id
        requirement_level:
          recommended: When the instance is a billed resource.
      - ref: focus.service.name
        requirement_level:
          recommended: When the instance is a billed resource.
